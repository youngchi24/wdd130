<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for information about rafting trips, reservations, and services.">

    <meta name="author" content="Prosper Chidike Nwogu">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rafting-logo.jpg" alt="White Water Rafting Site Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFORMATION -->
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>

            <p>
                <strong>123 Main River Street</strong><br>
                Kolob, California<br>
                <strong>+1 999 999 9999</strong><br>
                <strong>info@whitewater.com</strong>
            </p>
        </section>

        <!-- CONTACT AREA -->
        <section class="contact-section">

            <!-- GOOGLE MAP -->
            <div class="map">
                <iframe src="https://www.google.com/maps?q=Kolob%20Canyons%20Utah&output=embed"
                  width="100%" height="300" loading="lazy"
                  title="Map showing the White Water Rafting Company location">
                </iframe>
            </div>

            <!-- CONTACT FORM -->
            <form class="contact-form">

                <div class="form-item">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="White Water Rafting employee">
                    <figcaption>
                        <strong>Alex Johnson</strong><br>
                        River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="White Water Rafting employee">
                    <figcaption>
                        <strong>Sarah Williams</strong><br>
                        Reservations Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="White Water Rafting employee">
                    <figcaption>
                        <strong>Michael Brown</strong><br>
                        Adventure Coordinator
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 White Water Rafting |
            Prosper Chidike Nwogu
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML and CSS Quiz | WDD 130</title>

    <meta name="description" content="An HTML and CSS quiz created for WDD 130 Week 05.">

    <meta name="author" content="Prosper Chidike Nwogu">

    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1>HTML and CSS Quiz</h1>

        <form>

            <div class="form-item">
                <label for="q1">
                    1. What HTML element is used to create the largest heading?
                </label>

                <input type="text" id="q1" name="q1" placeholder="Enter your answer" required>
            </div>

            <div class="form-item">
                <label for="q2">
                    2. Explain briefly what CSS is used for on a web page.
                </label>

                <textarea id="q2" name="q2" rows="5" placeholder="Write your answer here..."
                  required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">
                    3. Which CSS property is used to change the text color?
                </label>

                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="background-color">background-color</option>
                    <option value="color">color</option>
                    <option value="font-size">font-size</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">
                    4. How many levels of HTML headings are available?
                </label>

                <input type="number" id="q4" name="q4" min="1" max="10" placeholder="Enter a number"
                  required>
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>

</html>
